services:
  mass-unfollow:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mass-unfollow
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    networks:
      - cloudflared_net
    # No `ports:` on purpose. Docker's port publishing inserts DNAT rules in
    # the PREROUTING chain, ahead of UFW/iptables' INPUT filtering -- a
    # published port on 0.0.0.0 is reachable from the public internet via
    # the host's public IP even with UFW blocking it, and binding to
    # 127.0.0.1 instead would stop that but also stop cloudflared (itself a
    # container) from reaching this over the docker0 bridge gateway. Instead
    # this container joins the same Docker network as cloudflared and is
    # reached by its service name (`mass-unfollow`) over that private
    # network -- never touches the host's network stack at all, so neither
    # the LAN nor the public internet can reach it directly regardless of
    # firewall rules. See the README's Cloudflare route step for the
    # matching tunnel config.

  # Additional fully independent instances for someone else to connect their
  # own Instagram account to. Same image/code, but its own container, own
  # data volume, own .env (own APP_PASSWORD/SECRET_KEY) — nothing here is
  # shared with the primary instance above or with each other. This app has
  # no multi-user support, so separate deployments are the safe way to let
  # another person use it without their session/data mixing with anyone
  # else's.
  mass-unfollow-martin:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mass-unfollow-martin
    restart: unless-stopped
    env_file:
      - .env.martin
    volumes:
      - ./data-martin:/data
    networks:
      - cloudflared_net

  mass-unfollow-tal:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mass-unfollow-tal
    restart: unless-stopped
    env_file:
      - .env.tal
    volumes:
      - ./data-tal:/data
    networks:
      - cloudflared_net

networks:
  # Must be the same Docker network your cloudflared container is already
  # on (check with `docker inspect <cloudflared-container> | grep -A5
  # Networks`, or your cloudflared compose file) -- rename this to match if
  # it's called something else. `external: true` means this file only joins
  # it, it doesn't try to create/own it.
  cloudflared_net:
    external: true
