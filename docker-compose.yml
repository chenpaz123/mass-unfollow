services:
  mass-unfollow:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mass-unfollow
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    ports:
      # Published on the host, same pattern as this deployment's other
      # cloudflared-routed services (n8n, portainer, jenkins): reachable via
      # the docker0 bridge gateway at 172.17.0.1:8000, and also on the LAN.
      # Access control comes from Cloudflare Access + APP_PASSWORD, not from
      # network isolation — make sure both are set before exposing this.
      - "8000:8000"
